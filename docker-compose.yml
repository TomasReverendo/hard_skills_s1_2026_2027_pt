# docker-compose.yml: arranca só a base de dados PostgreSQL num contentor.
# Uso: docker compose up -d   (na raiz do projeto)
# O backend e o frontend correm normalmente na tua máquina (ver README).
services:
  db:
    image: postgres:16-alpine
    container_name: livepulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: livepulse
    ports:
      - "5433:5432"  # porta 5433 no PC (a 5432 pode estar ocupada por outro PostgreSQL)
    volumes:
      - postgres_data:/var/lib/postgresql/data  # os dados sobrevivem a reinícios

volumes:
  postgres_data:
